<title>RHA Manager</title>

<style>

.leaflet-marker-icon,

	}

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {
	background: #fff;

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
	pointer-events: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;

	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

	margin-right: -12px;

	}
.leaflet-tooltip-right:before {

/* Layout: cabecera con indicadores, panel lateral de rutas/puntos y mapa amplio. En móvil el mapa va arriba y el panel debajo. */
:root{
  --bg:#f3f5fa; --panel:#ffffff; --ink:#162033; --muted:#566178; --line:#dde2ed;
  --blue:#0014DC; --navy:#051464; --aqua:#00B8C2; --soft:#e8ecff;
  --ok:#14804a; --ok-bg:#dff5e8; --warn:#8a5a00; --warn-bg:#fff0c2; --bad:#b42318; --bad-bg:#fde4e1;
  --mapbg:#dfe8f3; --grid:#d3dcea; --land:#f8faf6; --landline:#a9b4c6;
  --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --panel:#151c31; --ink:#e8ecf8; --muted:#9ba7c0; --line:#28314d;
  --blue:#7b86ff; --navy:#0a1030; --aqua:#2fd8e0; --soft:#222c57;
  --ok:#52d08c; --ok-bg:#12382a; --warn:#f2c14e; --warn-bg:#3d3010; --bad:#ff8a7e; --bad-bg:#42191a;
  --mapbg:#0f1830; --grid:#1b2644; --land:#1d2742; --landline:#4a5878; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --panel:#151c31; --ink:#e8ecf8; --muted:#9ba7c0; --line:#28314d;
  --blue:#7b86ff; --navy:#0a1030; --aqua:#2fd8e0; --soft:#222c57;
  --ok:#52d08c; --ok-bg:#12382a; --warn:#f2c14e; --warn-bg:#3d3010; --bad:#ff8a7e; --bad-bg:#42191a;
  --mapbg:#0f1830; --grid:#1b2644; --land:#1d2742; --landline:#4a5878; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:500}
button:hover{border-color:var(--blue)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme="dark"] button.pri,:root:not([data-theme="light"]) button.pri{color:#0b1030}
@media (prefers-color-scheme:light){button.pri{color:#fff}}
button.dan{color:var(--bad);border-color:var(--bad)}
button.dan.solid{background:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabecera */
.top{background:var(--navy);color:#fff;padding-block:10px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand i{display:block;width:34px;height:5px;border-radius:3px;background:var(--aqua);margin-bottom:5px}
.brand b{font-size:16px;font-weight:600}
.brand small{color:#b8c3f5;font-size:12px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 22px;flex:1;min-width:0}
.kpi{display:flex;flex-direction:column;min-width:78px}
.kpi span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#b8c3f5}
.kpi b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi.ok b::before,.kpi.warn b::before,.kpi.bad b::before,.kpi.blk b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:2px}
.kpi.blk b::before{background:#111;box-shadow:0 0 0 1.5px #fff}
.kpi.ok b::before{background:#2fd17c}.kpi.warn b::before{background:#f2b300}.kpi.bad b::before{background:#ff5a4d}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top button{background:transparent;color:#fff;border-color:#ffffff55}
.top button.pri{background:#fff;color:var(--navy);border-color:#fff}
details.more{position:relative}
details.more summary{list-style:none;cursor:pointer;border:1px solid #ffffff55;border-radius:6px;padding:7px 12px;font-weight:500}
details.more summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:1200;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;box-shadow:0 8px 24px #0003}
.menu button{border:0;text-align:left;background:transparent;color:var(--ink)}
.menu button:hover{background:var(--soft)}

/* cuerpo */

<script>
/*RULES-START*/
const MS = 86400000;
const pad = n => String(n).padStart(2, "0");
function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3] ? d : null;
}
const toISO = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
// Suma meses sin desbordar: 31 ene + 1 mes = 28/29 feb.
function addMonthsUTC(d, n) {
  const y = d.getUTCFullYear(), m = d.getUTCMonth() + n;
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), last)));
}
const addDaysISO = (iso, n) => toISO(new Date(parseISO(iso).getTime() + n * MS));
const addMonthsISO = (iso, n) => toISO(addMonthsUTC(parseISO(iso), n));
// Vencimiento oficial si existe; si no, emisión + 1 año.
const vencimiento = r => r.fechaVencimientoOficial || addMonthsISO(r.fechaEmision, 12);
// El estado nunca se guarda: se calcula con la fecha de hoy.
function estadoRHA(r, hoyISO) {
  const exp = parseISO(vencimiento(r)), hoy = parseISO(hoyISO);
  const dias = Math.round((exp - hoy) / MS);
  const estado = dias < 0 ? "vencido" : exp <= addMonthsUTC(hoy, 1) ? "proximo" : "vigente";
  return { estado, dias, vence: toISO(exp) };
}
function num(s) { s = String(s).trim().replace(",", "."); return s === "" ? NaN : Number(s); }
const coordOk = (lat, lng) => Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
// Texto "lat, lng" por línea -> puntos en el mismo orden. Devuelve {pts, errors}.
function parseCoordLines(text) {
  const pts = [], errors = [];
  String(text).split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const p = line.split(/[;,\s]+/).filter(Boolean);
    const lat = p.length === 2 ? Number(p[0]) : NaN, lng = p.length === 2 ? Number(p[1]) : NaN;
    if (!coordOk(lat, lng)) errors.push(`Punto intermedio, línea ${i + 1}: usa "latitud, longitud" con punto decimal (lat -90 a 90, lng -180 a 180).`);
    else pts.push({ lat, lng });
  });
  return { pts, errors };
}
const rutaPts = r => [r.inicio, ...(r.intermedios || []), r.fin];
/*RULES-END*/

/* ---------- estado y persistencia ---------- */
const TIPOS = {
  bache: { n: "Bache", c: "#b45309", g: "B", s: "circle" },
  pozo: { n: "Pozo", c: "#0e7490", g: "P", s: "circle" },
  zona_riesgo: { n: "Zona de riesgo", c: "#c2410c", g: "!", s: "diamond" },
  cruce_peligroso: { n: "Cruce peligroso", c: "#b91c1c", g: "X", s: "diamond" },
  puente: { n: "Puente", c: "#4d5bd1", g: "Pu", s: "square" },
  interseccion: { n: "Intersección", c: "#7e3fb4", g: "I", s: "square" },
  construccion: { n: "Zona de construcción", c: "#8a6a00", g: "C", s: "square" },
  referencia: { n: "Punto de referencia", c: "#3f5a76", g: "R", s: "circle" },
  otro: { n: "Otro", c: "#566178", g: "?", s: "circle" }
};
const ESTADOS_POI = { "": "Sin estado", abierto: "Abierto", seguimiento: "En seguimiento", resuelto: "Resuelto" };
const COLOR = { vigente: "#1fa463", proximo: "#f2b300", vencido: "#e5362b", prohibida: "#111111" };
const LABEL = { vigente: "Vigente", proximo: "Próximo a vencer", vencido: "Vencido", prohibida: "Ruta prohibida" };
// Solo hay cuatro colores: verde vigente, amarillo por vencer, rojo vencido, negro ruta prohibida.
const estadoUI = r => { const st = estadoRHA(r, HOY); return { ...st, vig: st.estado, estado: r.prohibida ? "prohibida" : st.estado }; };

const hoyLocal = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
let HOY = hoyLocal();
const S = { rha: [], poi: [], tab: "rha", filtro: "todos", q: "", sel: null, pick: null, ready: false };
let dbh = null, dl = null;
const LS = "rha_manager_v1";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fdate = iso => parseISO(iso) ? parseISO(iso).toLocaleDateString("es-CO", { timeZone: "UTC", day: "2-digit", month: "short", year: "numeric" }) : "—";
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

const col = k => (k === "rha" ? "rha" : "puntos");
async function saveDoc(kind, obj) {
  if (dbh) return dbh.doc(`${col(kind)}/${obj.id}`).set(obj);
  const list = S[kind]; const i = list.findIndex(x => x.id === obj.id);
  if (i >= 0) list[i] = obj; else list.push(obj);
  persistLocal(); render();
}
async function delDoc(kind, id) {
  if (dbh) return dbh.doc(`${col(kind)}/${id}`).delete();
  S[kind] = S[kind].filter(x => x.id !== id); persistLocal(); render();
}
function persistLocal() { try { localStorage.setItem(LS, JSON.stringify({ rha: S.rha, poi: S.poi })); } catch (e) { toast("No se pudo guardar en este navegador."); } }
// shortcut: id = máximo + 1; dos personas creando a la vez podrían repetir id, migrar a un contador en servidor al integrar con ANZIA.
function nextId(kind) {
  const p = kind === "rha" ? "RHA-" : "PI-";
  const max = S[kind].reduce((m, x) => Math.max(m, parseInt(String(x.id).slice(p.length), 10) || 0), 0);
  return p + String(max + 1).padStart(4, "0");
}

async function initStore() {
  try { dbh = window.claude ? await claude.use("db") : null; } catch (e) { dbh = null; }
  try { dl = window.claude ? await claude.use("downloads") : null; } catch (e) { dl = null; }
  
  if (dbh) {
    const bad = e => { toast("No se pudo leer la base de datos."); console.error(e); };
    dbh.collection("rha").onSnapshot(s => { S.rha = s.docs.map(d => d.data()); S.ready = true; render(true); }, bad);
    dbh.collection("puntos").onSnapshot(s => { S.poi = s.docs.map(d => d.data()); render(true); }, bad);
  } else {
    try { const j = JSON.parse(localStorage.getItem(LS) || "{}"); S.rha = j.rha || []; S.poi = j.poi || []; } catch (e) {}
    S.ready = true;
    $("warn").hidden = false;
    $("warn").textContent = "Modo local: los datos se guardan solo en este navegador. Exporta un respaldo con regularidad.";
    render(true);
  }
}

/* ---------- mapa ---------- */
// Sin teselas: el visor bloquea imágenes de otros sitios, así que el mapa base es vectorial e incrustado.
const map = L.map("map", { zoomControl: true, worldCopyJump: false, attributionControl: true });
const WEB = !window.claude;
if (WEB) {
  document.body.classList.add("web");
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imágenes © Esri" });
  const topo = L.tileLayer("https://tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, attribution: "© OpenTopoMap (CC-BY-SA)" });
  L.control.layers({ "Calles": osm, "Satélite": sat, "Relieve": topo }, null, { position: "topleft" }).addTo(map);
}
map.attributionControl.setPrefix("Leaflet");
map.attributionControl.addAttribution("Vías y ciudades © colaboradores de OpenStreetMap (ODbL) · Departamentos: Natural Earth");
map.fitBounds([[-4.3, -79.1], [13.5, -66.8]]);
map.createPane("vias").style.zIndex = 380;

function focus(kind, id) {
  const x = S[kind].find(i => i.id === id); if (!x) return;
  if (kind === "rha") map.fitBounds(L.latLngBounds(rutaPts(x).map(p => [p.lat, p.lng])), { padding: [60, 60], maxZoom: 16 });
  else map.setView([x.lat, x.lng], Math.max(map.getZoom(), 15));
}

map.on("click", e => {
  const { lat, lng } = e.latlng;
  if (S.pick) return finishPick(lat, lng);
  const el = document.createElement("div"); el.className = "mpop";
  el.innerHTML = `<b>Coordenadas</b><span class="mono">${lat.toFixed(6)}, ${lng.toFixed(6)}</span><div class="row"><button data-a="copy">Copiar</button><button data-a="poi">Registrar punto aquí</button></div>`;
  el.addEventListener("click", ev => {
    const a = ev.target.dataset.a;
    if (a === "copy") copy(`${lat.toFixed(6)}, ${lng.toFixed(6)}`);
    if (a === "poi") { map.closePopup(); formPOI(null, { lat: lat.toFixed(6), lng: lng.toFixed(6) }); }
  });
  L.popup().setLatLng(e.latlng).setContent(el).openOn(map);
});
async function copy(t) { try { await navigator.clipboard.writeText(t); toast("Coordenadas copiadas"); } catch (e) { toast(t); } }

/* ---------- panel: indicadores, lista, ficha ---------- */
function renderKPIs() {
  const c = { vigente: 0, proximo: 0, vencido: 0, prohibida: 0 };
  S.rha.forEach(r => c[estadoUI(r).estado]++);
  const tot = S.rha.length, pct = tot ? Math.round((c.vigente + c.proximo) / tot * 100) : 0;
  const k = (l, v, cls = "", t = "") => `<div class="kpi ${cls}" ${t ? `title="${esc(t)}"` : ""}><span>${l}</span><b>${v}</b></div>`;
  $("kpis").innerHTML = k("RHA registrados", tot) + k("Vigentes", c.vigente, "ok") + k("Próximos a vencer", c.proximo, "warn") + k("Vencidos", c.vencido, "bad") + k("Prohibidas", c.prohibida, "blk")
    + k("% vigentes", tot ? pct + "%" : "—", "", "RHA vigentes o por vencer (verdes y amarillos) sobre el total; las rutas prohibidas no cuentan") + k("Puntos de interés", S.poi.length);
}

function renderList() {
  const ru = S.tab === "rha";
  $("chips").hidden = !ru;
  $("tab-rha").textContent = `Rutas (${S.rha.length})`; $("tab-poi").textContent = `Puntos (${S.poi.length})`;
  const items = ru ? rhaVisibles() : poiVisibles();
  if (!items.length) {
    const none = ru ? !S.rha.length : !S.poi.length;
    $("list").innerHTML = `<div class="empty"><b>${none ? (ru ? "Aún no hay RHA registrados" : "Aún no hay puntos de interés") : "Sin resultados"}</b>${none ? (ru ? "Crea el primero con “+ Nuevo RHA”, o carga ejemplos de prueba desde “Más”." : "Registra un bache, pozo o cruce con “+ Nuevo punto”, o haz clic en el mapa.") : "Ajusta la búsqueda o el filtro de vigencia."}</div>`;
    return;
  }
  $("list").innerHTML = items.map(x => {
    const on = S.sel && S.sel.id === x.id ? " sel" : "";
    if (ru) {
      const st = estadoUI(x);
      return `<button class="item${on}" data-k="rha" data-id="${esc(x.id)}"><span class="bar" style="background:${COLOR[st.estado]}"></span><span class="t">${esc(x.nombre)}${x.esPrueba ? '<span class="test">PRUEBA</span>' : ""}</span><span class="pill ${st.estado}">${LABEL[st.estado]}</span><span class="s"><span class="mono">${esc(x.id)}</span> · ${diasTxt(st)}</span></button>`;
    }
    const t = TIPOS[x.tipo] || TIPOS.otro;
    return `<button class="item${on}" data-k="poi" data-id="${esc(x.id)}"><span class="bar" style="background:${t.c}"></span><span class="t">${esc(x.nombre)}${x.esPrueba ? '<span class="test">PRUEBA</span>' : ""}</span><span class="pill n">${esc(t.n)}</span><span class="s"><span class="mono">${esc(x.id)}</span>${x.estado ? " · " + ESTADOS_POI[x.estado] : ""}</span></button>`;
  }).join("");
}
function diasTxt(st) {
  const d = Math.abs(st.dias), u = d === 1 ? "día" : "días";
  return st.dias < 0 ? `vencido hace ${d} ${u}` : st.dias === 0 ? "vence hoy" : `faltan ${d} ${u}`;
}
const cc = p => `${p.lat}, ${p.lng}`;

function renderDetail() {
  const dv = $("detailview"), lv = $("listview");
  const x = S.sel && S[S.sel.kind].find(i => i.id === S.sel.id);
  if (!x) { S.sel = null; dv.hidden = true; lv.style.display = "flex"; return; }
  lv.style.display = "none"; dv.hidden = false;
  const back = `<button id="d-back">← Volver a la lista</button>`;
  const actions = `<div class="row"><button id="d-focus">Centrar en el mapa</button><button id="d-edit">Editar</button><button id="d-del" class="dan">Eliminar</button></div>`;
  if (S.sel.kind === "rha") {
    const st = estadoUI(x), mid = x.intermedios || [];
    dv.innerHTML = `<div class="det">${back}
      <div><div class="id">${esc(x.id)}${x.esPrueba ? '<span class="test">PRUEBA</span>' : ""}</div><h2>${esc(x.nombre)}</h2></div>
      <div class="big ${st.estado}">${LABEL[st.estado]}<small>${x.prohibida ? `Vigencia del RHA: ${LABEL[st.vig].toLowerCase()}. ` : ""}${st.dias < 0 ? `Vencido desde hace ${-st.dias} ${st.dias === -1 ? "día" : "días"}` : st.dias === 0 ? "Vence hoy" : `Quedan ${st.dias} ${st.dias === 1 ? "día" : "días"}`}</small></div>
      <dl><dt>Emisión</dt><dd>${fdate(x.fechaEmision)}</dd>
      <dt>Vencimiento</dt><dd>${fdate(st.vence)} <span class="hint">${x.fechaVencimientoOficial ? "(fecha oficial)" : "(emisión + 1 año)"}</span></dd>
      <dt>Responsable</dt><dd>${esc(x.responsable) || "—"}</dd>
      <dt>Descripción</dt><dd>${esc(x.descripcion) || "—"}</dd>
      <dt>Observaciones</dt><dd>${esc(x.observaciones) || "—"}</dd></dl>
      <h3>Coordenadas registradas (en orden)</h3>
      <ul class="pts mono"><li><span>Inicio</span><span>${esc(cc(x.inicio))}</span></li>
      ${mid.map((p, i) => `<li><span>Interm. ${i + 1}</span><span>${esc(cc(p))}</span></li>`).join("")}
      <li><span>Fin</span><span>${esc(cc(x.fin))}</span></li></ul>
      <div class="note">Trazado esquemático: la línea une las coordenadas con segmentos rectos, en el orden registrado. No representa la geometría real de la vía.</div>
      <div class="hint">Creado ${esc((x.creadoEn || "").slice(0, 10)) || "—"} · Actualizado ${esc((x.actualizadoEn || "").slice(0, 10)) || "—"}</div>
      ${actions}</div>`;
  } else {
    const t = TIPOS[x.tipo] || TIPOS.otro;
    dv.innerHTML = `<div class="det">${back}
      <div><div class="id">${esc(x.id)}${x.esPrueba ? '<span class="test">PRUEBA</span>' : ""}</div><h2>${esc(x.nombre)}</h2></div>
      <div><span class="pill n">${esc(t.n)}</span></div>
      <dl><dt>Latitud</dt><dd class="mono">${esc(x.lat)}</dd><dt>Longitud</dt><dd class="mono">${esc(x.lng)}</dd>
      <dt>Estado</dt><dd>${esc(ESTADOS_POI[x.estado || ""])}</dd>
      <dt>Registro</dt><dd>${fdate(x.fechaRegistro)}</dd>
      <dt>Descripción</dt><dd>${esc(x.descripcion) || "—"}</dd>
      <dt>Observaciones</dt><dd>${esc(x.observaciones) || "—"}</dd></dl>
      ${actions}</div>`;
  }
  $("d-back").onclick = () => select(null);
  $("d-focus").onclick = () => focus(S.sel.kind, S.sel.id);
  $("d-edit").onclick = () => (S.sel.kind === "rha" ? formRHA(x) : formPOI(x));
  $("d-del").onclick = () => confirmDel(S.sel.kind, x);
}

function select(kind, id) {
  S.sel = kind ? { kind, id } : null;
  if (kind) { S.tab = kind; syncTabs(); focus(kind, id); }
  render(true);
}
function syncTabs() {
  $("tab-rha").setAttribute("aria-selected", S.tab === "rha"); $("tab-poi").setAttribute("aria-selected", S.tab === "poi");
}
function render(keepView) {
  renderKPIs(); renderList(); renderDetail(); renderMap();
  if (S.ready && !fitted && (S.rha.length || S.poi.length)) { fitted = true; fitAll(); }
  void keepView;
}

/* ---------- formularios ---------- */
const mAbrir = html => { $("sheet").innerHTML = html; $("modal").hidden = false; $("sheet").scrollTop = 0; };
const mCerrar = () => { $("modal").hidden = true; $("sheet").innerHTML = ""; S.pick = null; $("pickbar").hidden = true; };
const val = id => $(id).value;
const showErrs = errs => { $("ferr").innerHTML = errs.length ? `<div class="errs"><ul>${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""; if (errs.length) $("ferr").scrollIntoView({ block: "nearest" }); };
const coordPair = (idLat, idLng, label, v) => `<div class="grid2"><label>${label} · latitud<input id="${idLat}" inputmode="decimal" value="${esc(v ? v.lat : "")}" placeholder="4.710989"></label><label>${label} · longitud<input id="${idLng}" inputmode="decimal" value="${esc(v ? v.lng : "")}" placeholder="-74.072092"></label></div>`;

  const n = !r;
  mAbrir(`<form id="form" novalidate><h2>${n ? "Nuevo RHA" : "Editar " + esc(r.id)}</h2>
    <div id="ferr"></div>
    <div class="grid2"><label>Identificador<input id="f-id" value="${esc(n ? nextId("rha") : r.id)}" ${n ? "" : "disabled"}></label>
    <label>Responsable del análisis<input id="f-resp" value="${esc(r?.responsable)}"></label></div>
    <label>Nombre de la ruta *<input id="f-nombre" value="${esc(r?.nombre)}" required></label>
    <label>Descripción<textarea id="f-desc" rows="2">${esc(r?.descripcion)}</textarea></label>
    <div class="grid2"><label>Fecha de emisión *<input id="f-emi" type="date" value="${esc(r?.fechaEmision)}" required></label>
    <label>Vencimiento oficial (opcional)<input id="f-ven" type="date" value="${esc(r?.fechaVencimientoOficial)}"></label></div>
    <div class="hint" id="f-calc"></div>
    <fieldset><legend>Recorrido</legend>
      ${coordPair("f-ilat", "f-ilng", "Inicio *", r?.inicio)}
      <div><button type="button" data-pick="ini">Elegir inicio en el mapa</button></div>
      <label>Puntos intermedios, uno por línea, en orden de recorrido ("latitud, longitud")<textarea id="f-mid" rows="4" class="mono" placeholder="4.62, -74.08">${esc((r?.intermedios || []).map(cc).join("\n"))}</textarea></label>
      <div><button type="button" data-pick="mid">Añadir intermedio desde el mapa</button></div>
      ${coordPair("f-flat", "f-flng", "Fin *", r?.fin)}
      <div><button type="button" data-pick="fin">Elegir fin en el mapa</button></div>
    </fieldset>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="f-proh" style="width:auto" ${r?.prohibida ? "checked" : ""}>Ruta prohibida (se dibuja en negro, sin importar la vigencia)</label>
    <label>Observaciones<textarea id="f-obs" rows="2">${esc(r?.observaciones)}</textarea></label>
    <div class="row" style="justify-content:flex-end"><button type="button" id="f-cancel">Cancelar</button><button class="pri" type="submit">Guardar RHA</button></div></form>`);
  const calc = () => {
    const e = val("f-emi"), o = val("f-ven");
    $("f-calc").textContent = o ? (parseISO(o) ? `Se respetará la fecha oficial: ${fdate(o)}.` : "") : parseISO(e) ? `Vencimiento calculado (emisión + 1 año): ${fdate(addMonthsISO(e, 12))}.` : "El vencimiento se calcula como emisión + 1 año.";
  };
  ["f-emi", "f-ven"].forEach(i => $(i).addEventListener("input", calc)); calc();
  wireForm(async () => {
    const errs = [], id = val("f-id").trim();
    if (!/^[A-Za-z0-9_-]+$/.test(id)) errs.push("El identificador solo admite letras, números, guion y guion bajo.");
    if (n && S.rha.some(x => x.id === id)) errs.push(`Ya existe un RHA con el identificador ${id}.`);
    if (!val("f-nombre").trim()) errs.push("Escribe el nombre de la ruta.");
    const emi = val("f-emi"), ven = val("f-ven");
    if (!parseISO(emi)) errs.push("La fecha de emisión es obligatoria y debe ser válida.");
    if (ven && !parseISO(ven)) errs.push("La fecha de vencimiento oficial no es válida.");
    if (ven && parseISO(emi) && ven < emi) errs.push("El vencimiento oficial no puede ser anterior a la emisión.");
    const ini = { lat: num(val("f-ilat")), lng: num(val("f-ilng")) }, fin = { lat: num(val("f-flat")), lng: num(val("f-flng")) };
    if (!coordOk(ini.lat, ini.lng)) errs.push("Inicio: latitud entre -90 y 90, longitud entre -180 y 180.");
    if (!coordOk(fin.lat, fin.lng)) errs.push("Fin: latitud entre -90 y 90, longitud entre -180 y 180.");

    if (errs.length) return showErrs(errs);
    const now = new Date().toISOString();
    await saveDoc("rha", {
      id, nombre: val("f-nombre").trim(), descripcion: val("f-desc").trim(), responsable: val("f-resp").trim(), observaciones: val("f-obs").trim(),
      fechaEmision: emi, fechaVencimientoOficial: ven || null, prohibida: document.getElementById("f-proh").checked, inicio: ini,
      intermedios: mid.pts.map((p, i) => ({ orden: i + 1, ...p })), fin,

    });
    mCerrar(); toast(n ? "RHA creado" : "RHA actualizado"); select("rha", id);
  });
}

    await saveDoc("poi", {

    });

function wireForm(onSave) {
  $("f-cancel").onclick = mCerrar;
  $("form").onsubmit = async e => { e.preventDefault(); try { await onSave(); } catch (err) { console.error(err); showErrs(["No se pudo guardar. Revisa tu conexión e inténtalo de nuevo."]); } };
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => startPick(b.dataset.pick));
}
const PICK_MSG = { ini: "Haz clic en el mapa para fijar el INICIO.", fin: "Haz clic en el mapa para fijar el FIN.", mid: "Haz clic en el mapa para añadir un punto intermedio al final de la lista.", poi: "Haz clic en el mapa para fijar la ubicación del punto." };
function startPick(t) { S.pick = t; $("modal").hidden = true; $("pickmsg").textContent = PICK_MSG[t]; $("pickbar").hidden = false; }
function endPick() { S.pick = null; $("pickbar").hidden = true; $("modal").hidden = false; }
function finishPick(lat, lng) {
  const t = S.pick, a = lat.toFixed(6), b = lng.toFixed(6);
  if (t === "ini") { $("f-ilat").value = a; $("f-ilng").value = b; }
  if (t === "fin") { $("f-flat").value = a; $("f-flng").value = b; }
  if (t === "poi") { $("f-lat").value = a; $("f-lng").value = b; }
  if (t === "mid") { const m = $("f-mid"); m.value = (m.value.trim() ? m.value.replace(/\s+$/, "") + "\n" : "") + `${a}, ${b}`; }
  endPick();
}

function confirmDel(kind, x) {
  mAbrir(`<h2>¿Eliminar ${esc(x.id)}?</h2><p style="margin:0">Se eliminará <b>${esc(x.nombre)}</b> de forma permanente. Esta acción no se puede deshacer.</p>
    <div class="row" style="justify-content:flex-end"><button id="c-no">Cancelar</button><button id="c-si" class="dan solid">Eliminar</button></div>`);
  $("c-no").onclick = mCerrar;
  $("c-si").onclick = async () => {
    try { await delDoc(kind, x.id); mCerrar(); S.sel = null; render(true); toast("Registro eliminado"); } catch (e) { toast("No se pudo eliminar."); }
  };
}

/* ---------- ejemplos, respaldo, eventos ---------- */
// Datos ficticios para probar colores y orden de puntos; no son rutas reales.
async function seed() {
  const now = new Date().toISOString(), base = { esPrueba: true, creadoEn: now, actualizadoEn: now, responsable: "Datos de prueba", observaciones: "Registro ficticio para validar la aplicación." };
  const R = (nombre, emi, ini, mid, fin, descripcion) => ({ ...base, nombre, descripcion, fechaEmision: emi, fechaVencimientoOficial: null, inicio: ini, intermedios: mid.map((p, i) => ({ orden: i + 1, ...p })), fin });
  const P = (a, b) => ({ lat: a, lng: b });
  let r = parseInt(nextId("rha").slice(4), 10), q = parseInt(nextId("poi").slice(3), 10);
  const rs = [
    R("PRUEBA · Vigente (vence en ~6 meses)", addMonthsISO(HOY, -6), P(4.55, -74.15), [P(4.56, -74.13)], P(4.58, -74.11), "Ejemplo 1: debe verse en verde."),
    R("PRUEBA · Próximo a vencer (20 días)", addMonthsISO(addDaysISO(HOY, 20), -12), P(4.65, -74.13), [], P(4.68, -74.09), "Ejemplo 2: debe verse en amarillo con 20 días restantes."),
    R("PRUEBA · Vencido hace 15 días", addMonthsISO(addDaysISO(HOY, -15), -12), P(4.54, -74.08), [], P(4.57, -74.05), "Ejemplo 3: debe verse en rojo, vencido hace 15 días."),
    R("PRUEBA · Ruta prohibida", HOY, P(4.50, -74.20), [], P(4.53, -74.16), "Ejemplo: debe verse en negro."),
    R("PRUEBA · Cuatro intermedios en zigzag", HOY, P(4.60, -74.10), [P(4.62, -74.08), P(4.61, -74.05), P(4.64, -74.04), P(4.63, -74.01)], P(4.66, -74.0), "Ejemplo 4: el trazo debe seguir el orden registrado.")
  ];
  for (const x of rs) await saveDoc("rha", { id: "RHA-" + String(r++).padStart(4, "0"), ...x, prohibida: x.nombre.includes("prohibida") });
  const ps = [
    { nombre: "PRUEBA · Bache", tipo: "bache", lat: 4.605, lng: -74.09, descripcion: "Ejemplo 5: bache ficticio." },
    { nombre: "PRUEBA · Pozo", tipo: "pozo", lat: 4.565, lng: -74.12, descripcion: "Pozo ficticio." }
  ];
  for (const x of ps) await saveDoc("poi", { ...base, fechaRegistro: HOY, estado: "abierto", ...x, id: "PI-" + String(q++).padStart(4, "0") });
  fitted = false; render(); toast("Ejemplos de prueba cargados");
}
async function unseed() {
  const t = [...S.rha.filter(x => x.esPrueba).map(x => ["rha", x.id]), ...S.poi.filter(x => x.esPrueba).map(x => ["poi", x.id])];
  for (const [k, id] of t) await delDoc(k, id);
  S.sel = null; render(); toast(t.length ? "Datos de prueba eliminados" : "No hay datos de prueba");
}
async function guardar({ filename, data }) {
  if (dl) return dl.save({ filename, data });
  const u = URL.createObjectURL(new Blob([data])), a = document.createElement("a");
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}
// Importa un respaldo JSON; cada registro se valida igual que en los formularios y los inválidos se omiten.
const okPt = p => p && coordOk(Number(p.lat), Number(p.lng));
async function importar(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { return toast("El archivo no es un JSON válido."); }
  let ok = 0, mal = 0;
  const idOk = id => /^[A-Za-z0-9_-]+$/.test(String(id || ""));
  for (const r of Array.isArray(j.rha) ? j.rha : []) {
    if (idOk(r.id) && r.nombre && parseISO(r.fechaEmision) && (!r.fechaVencimientoOficial || parseISO(r.fechaVencimientoOficial)) && okPt(r.inicio) && okPt(r.fin) && (r.intermedios || []).every(okPt)) { await saveDoc("rha", r); ok++; } else mal++;
  }
  for (const p of Array.isArray(j.puntos) ? j.puntos : []) {
    if (idOk(p.id) && p.nombre && TIPOS[p.tipo] && okPt(p)) { await saveDoc("poi", p); ok++; } else mal++;
  }
  toast(`Importados ${ok} registros${mal ? `; ${mal} omitidos por datos inválidos` : ""}`);
}
// Rutas y puntos para verlos en mapas públicos. Coordenadas tal cual están guardadas; el orden de los puntos no cambia.
async function exportarMapa(fmt) {
  if (!S.rha.length && !S.poi.length) return toast("No hay rutas ni puntos para exportar.");
  const x = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));
  const info = r => { const st = estadoUI(r); return { st, txt: `${LABEL[st.estado]} · Emisión ${r.fechaEmision} · Vence ${st.vence} · ${diasTxt(st)}${r.responsable ? " · Responsable: " + r.responsable : ""}` }; };
  let out, name;
  if (fmt === "kml") {
    const kc = { vigente: "ff63a41f", proximo: "ff00b3f2", vencido: "ff2b36e5", prohibida: "ff111111" }; // KML usa aabbggrr
    const styles = Object.entries(kc).map(([k, c]) => `<Style id="${k}"><LineStyle><color>${c}</color><width>4</width></LineStyle></Style>`).join("");
    const rutas = S.rha.map(r => { const { st, txt } = info(r); return `<Placemark><name>${x(r.id + " · " + r.nombre)}</name><description>${x(txt + (r.observaciones ? " · " + r.observaciones : ""))}</description><styleUrl>#${st.estado}</styleUrl><LineString><tessellate>1</tessellate><coordinates>${rutaPts(r).map(p => `${p.lng},${p.lat},0`).join(" ")}</coordinates></LineString></Placemark>`; }).join("");
    const pts = S.poi.map(p => `<Placemark><name>${x(p.nombre)}</name><description>${x((TIPOS[p.tipo] || TIPOS.otro).n + (p.descripcion ? " · " + p.descripcion : ""))}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join("");
    out = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>RHA ${HOY}</name>${styles}<Folder><name>Rutas RHA</name>${rutas}</Folder><Folder><name>Puntos de interés</name>${pts}</Folder></Document></kml>`;
    name = `RHA_mapa_${HOY}.kml`;
  } else {
    const f = [...S.rha.map(r => { const { st, txt } = info(r); return { type: "Feature", properties: { id: r.id, nombre: r.nombre, estado: LABEL[st.estado], emision: r.fechaEmision, vencimiento: st.vence, detalle: txt, stroke: COLOR[st.estado], "stroke-width": 4 }, geometry: { type: "LineString", coordinates: rutaPts(r).map(p => [p.lng, p.lat]) } }; }),
      ...S.poi.map(p => ({ type: "Feature", properties: { id: p.id, nombre: p.nombre, tipo: (TIPOS[p.tipo] || TIPOS.otro).n, descripcion: p.descripcion, "marker-color": (TIPOS[p.tipo] || TIPOS.otro).c }, geometry: { type: "Point", coordinates: [p.lng, p.lat] } }))];
    out = JSON.stringify({ type: "FeatureCollection", features: f }, null, 2); name = `RHA_mapa_${HOY}.geojson`;
  }
  // El visor del artefacto solo permite algunas extensiones: .json y .txt sirven y se renombran fuera.
  if (dl) name = fmt === "kml" ? name + ".txt" : name.replace(/geojson$/, "json");
  try { await guardar({ filename: name, data: out }); toast(dl && fmt === "kml" ? "Guardado. Quita el .txt final del nombre para abrirlo en Google Earth o My Maps" : "Archivo de mapa guardado"); } catch (e) { if (e && e.code !== "declined") toast("No se pudo exportar."); }
}
async function exportarXlsx() {
  if (typeof XLSX === "undefined") return toast("No se cargó la librería de Excel.");
  const rha = S.rha.map(r => { const st = estadoUI(r); return { Identificador: r.id, Nombre: r.nombre, Responsable: r.responsable, Descripcion: r.descripcion, Emision: r.fechaEmision, Vencimiento: st.vence, "Vencimiento oficial": r.fechaVencimientoOficial ? "Sí" : "No", Estado: LABEL[st.estado], "Vigencia (por fechas)": LABEL[st.vig], "Dias (negativo = vencido)": st.dias, "Inicio lat": r.inicio.lat, "Inicio lng": r.inicio.lng, "Fin lat": r.fin.lat, "Fin lng": r.fin.lng, "Puntos intermedios": (r.intermedios || []).length, Observaciones: r.observaciones, Prueba: r.esPrueba ? "Sí" : "No" }; });
  const pts = S.poi.map(p => ({ Identificador: p.id, Nombre: p.nombre, Tipo: (TIPOS[p.tipo] || TIPOS.otro).n, Latitud: p.lat, Longitud: p.lng, Estado: ESTADOS_POI[p.estado || ""], "Fecha de registro": p.fechaRegistro, Descripcion: p.descripcion, Observaciones: p.observaciones, Prueba: p.esPrueba ? "Sí" : "No" }));
  const co = S.rha.flatMap(r => [{ t: "Inicio", ...r.inicio }, ...(r.intermedios || []).map(p => ({ t: "Intermedio", ...p })), { t: "Fin", ...r.fin }].map((p, i) => ({ "RHA": r.id, Orden: i + 1, Tipo: p.t, Latitud: p.lat, Longitud: p.lng })));
  const wb = XLSX.utils.book_new();
  [["RHA", rha], ["Puntos", pts], ["Coordenadas", co]].forEach(([n, d]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d), n));
  try { await guardar({ filename: `RHA_datos_${HOY}.xlsx`, data: XLSX.write(wb, { bookType: "xlsx", type: "array" }) }); toast("Excel guardado"); }
  catch (e) { if (e && e.code !== "declined") toast("No se pudo exportar."); }
}
async function exportar() {
  try { await guardar({ filename: `RHA_respaldo_${HOY}.json`, data: JSON.stringify({ exportado: new Date().toISOString(), rha: S.rha, puntos: S.poi }, null, 2) }); toast("Respaldo guardado"); }
  catch (e) { if (e && e.code !== "declined") toast("No se pudo exportar."); }
}

$("b-new-rha").onclick = () => formRHA(null);
$("b-new-poi").onclick = () => formPOI(null);
$("b-fit").onclick = () => { $("more").open = false; fitAll(); };
$("b-xlsx").onclick = () => { $("more").open = false; exportarXlsx(); };
$("b-import").onclick = () => { $("more").open = false; $("f-import").click(); };
$("f-import").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importar(f).catch(() => toast("No se pudo importar.")); };
$("b-kml").onclick = () => { $("more").open = false; exportarMapa("kml"); };
$("b-geojson").onclick = () => { $("more").open = false; exportarMapa("geojson"); };
$("b-export").onclick = () => { $("more").open = false; exportar(); };
$("b-seed").onclick = async () => { $("more").open = false; try { await seed(); } catch (e) { toast("No se pudieron cargar los ejemplos."); } };
$("b-unseed").onclick = () => { $("more").open = false; unseed().catch(() => toast("No se pudieron borrar.")); };
$("pickcancel").onclick = endPick;
$("tab-rha").onclick = () => { S.tab = "rha"; syncTabs(); render(); };
$("tab-poi").onclick = () => { S.tab = "poi"; syncTabs(); render(); };
$("q").oninput = e => { S.q = e.target.value; render(); };
$("chips").onclick = e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  S.filtro = b.dataset.f; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render();
};
$("list").onclick = e => { const b = e.target.closest(".item"); if (b) select(b.dataset.k, b.dataset.id); };
$("modal").onmousedown = e => { if (e.target === $("modal") && $("sheet").querySelector("#c-no")) mCerrar(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (S.pick) endPick(); else if (!$("modal").hidden) mCerrar(); else if (S.sel) select(null);
});
// El estado depende de la fecha: se recalcula al cambiar el día aunque la página siga abierta.
setInterval(() => { const h = hoyLocal(); if (h !== HOY) { HOY = h; render(); } }, 60000);

initBase();
render();
initStore();
</script>
